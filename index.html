<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#081321">
<title>BINZ ONE — Virtual 3D Office V1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081321;font-family:-apple-system,sans-serif;color:#eef5ff}
#scene{position:fixed;inset:0}
.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.brand{background:#0c1b2ddd;border:1px solid #29425b;border-radius:14px;padding:10px 13px}
.brand b{color:#e8c878;font-size:13px}
.status{font-size:10px;color:#9de4bb;background:#102b28;border:1px solid #275d4c;padding:8px 10px;border-radius:99px}
.hint{position:fixed;top:70px;left:12px;right:12px;text-align:center;color:#b8c8d9;font-size:11px;z-index:2}
</style>
</head>
<body>
<div id="scene"></div>
<div class="top">
 <div class="brand"><b>BINZ ONE</b><br><small style="color:#9fb2c7;font-size:10px">VIRTUAL HEADQUARTERS · V1</small></div>
 <div class="status">● TEST 3D</div>
</div>
<div class="hint">Đang kiểm tra mô hình 3D...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const mount = document.getElementById('scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x081321);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8, 9, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9dbce0, 0x152235, 2));
const key = new THREE.DirectionalLight(0xffe4b0, 3);
key.position.set(7, 12, 8);
scene.add(key);

const floor = new THREE.Mesh(
  new THREE.BoxGeometry(13, 0.35, 9),
  new THREE.MeshStandardMaterial({ color: 0x17283b })
);
floor.position.y = -0.3;
scene.add(floor);

const colors = [0xd8b75f, 0x53b9ad, 0x6e9ee8, 0xb58be8, 0xe28b70];
const positions = [[0,0], [-4.3,-2.65], [4.3,-2.65], [-4.3,2.65], [4.3,2.65]];

positions.forEach((p, i) => {
  const group = new THREE.Group();
  group.position.set(p[0], 0, p[1]);
  
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(3.4, 0.13, 2.5),
    new THREE.MeshStandardMaterial({ color: 0x20364b })
  );
  group.add(base);

  const top = new THREE.Mesh(
    new THREE.BoxGeometry(3.4, 0.1, 2.5),
    new THREE.MeshStandardMaterial({ color: colors[i], emissive: colors[i], emissiveIntensity: 0.3 })
  );
  top.position.y = 1.5;
  group.add(top);

  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(3.4, 1.4, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x34516a, transparent: true, opacity: 0.7 })
  );
  wall.position.set(0, 0.7, -1.25);
  group.add(wall);

  scene.add(group);
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
